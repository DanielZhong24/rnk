<!doctype html>
<html
	lang="en"
	class="bg-base font-jetbrains-mono text-text selection:bg-accent/30 selection:text-accent/80 caret-accent scrollbar min-h-screen"
>
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="og:locale" content="en_US" />

		<script data-theme-init>
			(() => {
				try {
					document.documentElement.classList.remove('latte', 'frappe', 'macchiato', 'mocha');
					document.documentElement.classList.add('mocha');

					const accent = 'pink';
					document.documentElement.style.setProperty(
						'--current-accent-color',
						`var(--color-${accent})`
					);
				} catch (error) {
					console.warn('Theme bootstrapping failed', error);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
